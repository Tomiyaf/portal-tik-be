services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: portal_tik_app

    working_dir: /var/www

    volumes:
      - .:/var/www
    
    env_file:
      - .env

    networks:
      - laravel


  nginx:
    image: nginx:alpine

    container_name: portal_tik_nginx

    ports:
      - "8000:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel


  mysql:
    image: mysql:8.4

    container_name: portal_tik_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel


  mqtt:
    image: eclipse-mosquitto

    container_name: portal_tik_mqtt

    ports:
      - "1883:1883"

    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

    networks:
      - laravel


volumes:
  mysql_data:


networks:
  laravel: